[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reloved-social-engine"
version = "0.1.0"
description = "AI-assisted social content engine for ReLoved"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.68.0",
  "Pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = ["build>=1.2.2", "mypy>=1.13.0", "pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
reloved = "reloved_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
